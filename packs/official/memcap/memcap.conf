# Memory limits per app (Frame Tweaks "Memory caps"). Units: K, M, G. Above *_high the app is
# slowed down and its memory reclaimed; at *_max it's stopped. The Frame has 16 GB.
# Takes effect the next time the app starts (VSCodium: after ./install.sh install memcap).
whisper_high=2G
whisper_max=3G
scrcpy_high=1G
scrcpy_max=2G
vscodium_high=3G
vscodium_max=5G
