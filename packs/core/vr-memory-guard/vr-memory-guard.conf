# VR memory guard (Frame Tweaks). Sizes in M or G (whole numbers). After editing, run
# ./install.sh install vr-memory-guard again.
#
# Memory that desktop apps (Firefox, Discover, the apps you open from the menu) leave free for
# SteamVR, Steam and the game you're playing. Together they may use the rest; past it, the app
# that asked for more is stopped. The Frame has 16 GB.
reserve_for_vr=5G
# How much of the apps' memory may go to swap (compressed memory on the Frame) on top of that.
apps_swap_max=2G
# Firefox on its own: stopped above this. Signing in to Firefox can install all your
# extensions at once, which has taken 10 GB on a Frame.
firefox_max=5G
firefox_swap_max=1G
