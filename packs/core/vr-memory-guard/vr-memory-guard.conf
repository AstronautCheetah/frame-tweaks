# VR memory guard (Frame Tweaks). Sizes in M or G (whole numbers). After editing, run
# ./install.sh install vr-memory-guard again (or vr-memory-guard-tool apply).
#
# Memory that Flatpak apps (Firefox, and the apps you install from Discover) leave free for
# SteamVR, Steam and the game you're playing. Together they may use the rest; past it, the app
# that asked for more is stopped. Games and the desktop itself aren't limited. The Frame has 16 GB.
reserve_for_vr=5G
# How much of the apps' memory may go to swap (compressed memory on the Frame) on top of that.
apps_swap_max=2G
# Each Flatpak app's own limit (Firefox's 5G among them) is in vr-memory-guard-apps.conf: the
# installer window's Memory limits page or vr-memory-guard-tool sets it.
# Frame Tweaks' own heavy helpers, each on its own (they run outside Flatpak). Dictation: Whisper
# started for a dictation takes about 600 MB, an engine kept loaded up to about 1.3 GB (Parakeet).
dictation_max=2500M
# Android Mirror's scrcpy (it runs in Steam's own service when opened from Steam's + menu, which
# nothing else limits).
mirror_max=1G
