# Frame Tweaks: Bluetooth headphones, music only. WirePlumber offers Bluetooth audio devices
# these roles; without the hands-free and headset ones (hfp_hf hfp_ag hsp_hs hsp_ag), headphones
# connect for music (A2DP) only. Their microphone and the call profile's open voice channel are
# left out: that channel is what wedged a pair of earbuds across a sleep of the Frame, and
# SteamVR uses the Frame's own microphone. Removed by ./install.sh uninstall bt-music-only.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source ]
}
