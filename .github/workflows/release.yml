name: Release
# Run by hand (Actions → Release → Run workflow). Turns CHANGELOG's "## Unreleased" section into
# the new version's notes (a pre-release leaves the section for the release), bumps VERSION,
# commits, tags vX.Y.Z (or vX.Y.Z-rc.N) and drafts a GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      prerelease:
        description: Pre-release (vX.Y.Z-rc.N, only for the beta channel)
        type: boolean
        default: false
      allow_untranslated:
        description: Release with texts not translated yet (they show in English)
        type: boolean
        default: false
permissions:
  contents: write
  actions: write       # to start CI on the release commit (pushes made here don't trigger it)
concurrency:
  group: release
jobs:
  release:
    runs-on: ubuntu-24.04     # (named, not ubuntu-latest: a new Ubuntu comes in when we try it, not by surprise)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # Changes are made in English only; just before each release, a translation pass brings
      # every language to every text (CONTRIBUTING.md, Releasing; `dev/i18n.py todo` says what's
      # left, locale/CHANGES.md what changed). Texts marked as needing review count as translated.
      - name: Translations are current and complete (dev/i18n.py)
        env:
          ALLOW: ${{ inputs.allow_untranslated }}
        run: |
          python3 dev/i18n.py check
          if [ "$ALLOW" = true ]; then python3 dev/i18n.py todo; else python3 dev/i18n.py todo --strict; fi
      - name: Work out the version
        id: v
        env:
          BUMP: ${{ inputs.bump }}
          PRE: ${{ inputs.prerelease }}
        run: |
          IFS=. read -r major minor patch < <(sed 's/-.*//' VERSION)
          # After a pre-release (VERSION X.Y.Z-rc.N), X.Y.Z isn't out yet: a bump that X.Y.Z already
          # has keeps it (the next rc, or the release itself), as semver's increments do.
          pre=; grep -q -- - VERSION && pre=1
          case "$BUMP" in
            major) [ -n "$pre" ] && [ "$minor.$patch" = 0.0 ] || { major=$((major + 1)); minor=0; patch=0; } ;;
            minor) [ -n "$pre" ] && [ "$patch" = 0 ] || { minor=$((minor + 1)); patch=0; } ;;
            patch) [ -n "$pre" ] || patch=$((patch + 1)) ;;
          esac
          v="$major.$minor.$patch"
          if [ "$PRE" = true ]; then
            # (after the highest: counting them gave one that exists when an earlier one was deleted)
            n=$(git tag -l "v$v-rc.*" | sed -n 's/.*-rc\.\([0-9]*\)$/\1/p' | sort -n | tail -1); v="$v-rc.$((${n:-0} + 1))"
          fi
          git rev-parse -q --verify "refs/tags/v$v" && { echo "v$v already exists"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Changelog and VERSION
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          grep -q '^## Unreleased' CHANGELOG.md || { echo 'CHANGELOG.md has no "## Unreleased" section'; exit 1; }
          awk '/^## Unreleased/{f=1; next} f && /^## /{exit} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "the Unreleased section is empty"; exit 1; }
          # A pre-release takes its notes from the section and leaves it: the release it leads up
          # to dates it, with everything since the last release in it.
          case "$V" in
            *-*) ;;
            *) sed -i "s/^## Unreleased.*/## $V ($(date +%Y-%m-%d))/" CHANGELOG.md ;;
          esac
          echo "$V" > VERSION
          # (AppStream writes a pre-release with "~": 0.6.2~rc.1 comes before 0.6.2, where 0.6.2-rc.1
          # would come after it, and appstreamcli calls the list out of order once 0.6.2 is out)
          type=""; mv=$V
          case "$V" in *-*) type=' type="development"'; mv=$(printf '%s' "$V" | sed 's/-/~/') ;; esac
          sed -i "s|  <releases>|  <releases>\n    <release version=\"$mv\" date=\"$(date +%Y-%m-%d)\"$type/>|" share/metainfo/*.metainfo.xml
      - name: Commit, tag, push, draft release
        env:
          V: ${{ steps.v.outputs.version }}
          PRE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          git config user.name AstronautCheetah
          git config user.email 189046832+AstronautCheetah@users.noreply.github.com
          git commit -q -am "chore(release): $V"
          # Signed with the release key (an SSH key; its public half is in dev/release-signers):
          # ./install.sh update checks it before moving to a new release.
          [ -n "$SIGNING_KEY" ] || { echo "the RELEASE_SIGNING_KEY secret is missing (CONTRIBUTING.md, Releasing)"; exit 1; }
          key=$(mktemp); trap 'rm -f "$key"' EXIT; chmod 600 "$key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          git -c gpg.format=ssh -c user.signingkey="$key" tag -s "v$V" -m "v$V"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=dev/release-signers verify-tag "v$V"
          # (both or neither: a tag out while main refused the commit, say because it moved
          # meanwhile, would be a release whose commit main never gets)
          git push --atomic origin HEAD:main "v$V"
          flags=(--draft --title "v$V" --notes-file notes.md)
          [ "$PRE" = true ] && flags+=(--prerelease)
          gh release create "v$V" "${flags[@]}"
          gh workflow run ci.yml --ref main
