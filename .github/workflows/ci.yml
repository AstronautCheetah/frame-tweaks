name: CI
# Once per commit on main (tag pushes point at commits already checked), plus pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x -S warning $(grep -lE '^#!(/bin/(ba)?sh|/usr/bin/env bash)' -r --exclude-dir=.git .)
      - name: Python syntax
        run: |
          for f in $(grep -lE '^#!/usr/bin/env python3' -r --exclude-dir=.git .); do
            python3 -m py_compile "$f"
          done
          python3 -m py_compile gui/*.py arrowpad/*.py     # modules without a shebang
      - name: No attribution trailers (CLAUDE.md)
        run: |
          if git log --format=%B | grep -iE '^[[:space:]]*(Co-authored-by|Claude-Session|Assisted-by|Generated-by)[[:space:]]*:|^[[:space:]]*(🤖[[:space:]]*)?Generated with \['; then
            echo "attribution trailer found in history"; exit 1
          fi
      - name: Manifest and installer self-checks
        run: |
          # every component in components.tsv has install/uninstall/status scripts and a README
          grep -v '^#' components.tsv | cut -f1 | while read -r c; do
            for f in install.sh uninstall.sh status.sh README.md; do
              test -f "$c/$f" || { echo "missing $c/$f"; exit 1; }
            done
          done
          ./install.sh list
          ./install.sh _deps all
          ./install.sh _deps signal | grep -q '^wallet signal'
          # every pinned download names a version, a URL and a SHA256
          for pin in */pin; do
            grep -qE '^version=.+' "$pin" && grep -qE '^url=https://' "$pin" && grep -qE '^sha256=[0-9a-f]{64}$' "$pin" ||
              { echo "incomplete $pin"; exit 1; }
          done
      - name: Unit tests
        run: |
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 >/dev/null
          python3 -m pip install --quiet PyQt6
          QT_QPA_PLATFORM=offscreen python3 -m unittest discover -s tests -v
      - name: AppStream metadata and desktop entry
        run: |
          sudo apt-get install -y appstream desktop-file-utils >/dev/null
          appstreamcli validate --no-net share/metainfo/*.metainfo.xml
          for f in share/applications/*.desktop; do sed 's|@REPO@|/opt/x|' "$f" > "/tmp/$(basename "$f")"; desktop-file-validate "/tmp/$(basename "$f")"; done
      - name: Docs consistency (README rows, links, generated tables)
        run: |
          python3 dev/check-docs.py
          python3 dev/gen-docs.py --check
      - name: Install, status and uninstall in a throwaway home
        run: |
          sudo apt-get install -y libarchive-tools     # bsdtar, as on SteamOS
          dev/test-tweaks.sh
