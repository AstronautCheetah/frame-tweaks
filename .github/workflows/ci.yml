name: CI
# Once per commit on main (tag pushes point at commits already checked), plus pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Read-only token: CI checks, it never writes.
permissions:
  contents: read
# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Refresh the package index (a stale runner index gives 404s)
        run: sudo apt-get update -qq
      # Each check is dev/check.sh's (the same commands a contributor runs); here only the tools
      # are installed first. (CI=true, set by GitHub: a missing tool fails instead of skipping.)
      - name: ShellCheck, and programs replaced rather than written into
        run: |
          sudo apt-get install -y shellcheck
          dev/check.sh shell
      - name: Translation template is current (dev/i18n.py; locale/README.md)
        run: dev/check.sh i18n
      - name: Python syntax
        run: dev/check.sh python
      - name: Conventional Commits messages (commitizen, .cz.toml)
        run: |
          python3 -m pip install --quiet commitizen
          dev/check.sh commits
      - name: Manifests, dependencies and pins
        run: dev/check.sh manifests
      - name: Unit tests
        run: |
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 xvfb libxtst6 >/dev/null
          # the PyQt6 users get (lib/python-constraints.txt); pyyaml: tests compare our manifest reader with it
          python3 -m pip install --quiet -c lib/python-constraints.txt PyQt6 pyyaml
          dev/check.sh tests
      - name: AppStream metadata and desktop entry
        run: |
          sudo apt-get install -y appstream desktop-file-utils >/dev/null
          dev/check.sh metadata
      - name: Docs consistency (README rows, links, generated tables)
        run: dev/check.sh docs
      - name: Install, status and uninstall in a throwaway home
        run: |
          sudo apt-get install -y libarchive-tools     # bsdtar, as on SteamOS
          dev/check.sh tweaks
