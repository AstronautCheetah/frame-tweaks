name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x -S warning $(grep -lE '^#!(/bin/(ba)?sh|/usr/bin/env bash)' -r --exclude-dir=.git .)
      - name: Python syntax
        run: |
          for f in $(grep -lE '^#!/usr/bin/env python3' -r --exclude-dir=.git .); do
            python3 -m py_compile "$f"
          done
          python3 -m py_compile gui/*.py arrowpad/*.py     # modules without a shebang
      - name: No attribution trailers (CLAUDE.md)
        run: |
          if git log --format=%B | grep -iE '^[[:space:]]*(Co-authored-by|Claude-Session|Assisted-by|Generated-by)[[:space:]]*:|^[[:space:]]*(🤖[[:space:]]*)?Generated with \['; then
            echo "attribution trailer found in history"; exit 1
          fi
      - name: Manifest and installer self-checks
        run: |
          # every component in components.tsv has install/uninstall/status scripts and a README
          grep -v '^#' components.tsv | cut -f1 | while read -r c; do
            for f in install.sh uninstall.sh status.sh README.md; do
              test -f "$c/$f" || { echo "missing $c/$f"; exit 1; }
            done
          done
          ./install.sh list
          ./install.sh _deps all
          ./install.sh _deps signal | grep -q '^wallet signal'
          # every pinned download names a version, a URL and a SHA256
          for pin in */pin; do
            grep -qE '^version=.+' "$pin" && grep -qE '^url=https://' "$pin" && grep -qE '^sha256=[0-9a-f]{64}$' "$pin" ||
              { echo "incomplete $pin"; exit 1; }
          done
      - name: Docs consistency (README rows, links)
        run: python3 dev/check-docs.py
      - name: Install, status and uninstall in a throwaway home
        run: dev/test-tweaks.sh
