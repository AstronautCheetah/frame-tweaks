name: CI
# Once per commit on main (tag pushes point at commits already checked), plus pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Read-only token: CI checks, it never writes.
permissions:
  contents: read
# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Refresh the package index (a stale runner index gives 404s)
        run: sudo apt-get update -qq
      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -x -S warning $(grep -lE '^#!(/bin/(ba)?sh|/usr/bin/env bash)' -r --exclude-dir=.git .)
      - name: Programs are replaced, not written into (lib/common.sh write_file)
        run: |
          ! grep -nE '(>|\bcp\b[^|]*) *"\$(BIN|HOME/\.local/bin)/' packs/*/*/*.sh lib/common.sh | grep -v write_file
      - name: Translation template is current (dev/i18n.py; locale/README.md)
        run: python3 dev/i18n.py check
      - name: Python syntax
        run: |
          for f in $(grep -lE '^#!/usr/bin/env python3' -r --exclude-dir=.git .); do
            python3 -m py_compile "$f"
          done
          python3 -m py_compile gui/*.py lib/*.py packs/original/arrowpad/*.py     # modules without a shebang
      - name: Conventional Commits messages (commitizen, .cz.toml)
        run: |
          python3 -m pip install --quiet commitizen
          dev/check-commit-msg.sh --all
      - name: Manifest and installer self-checks
        run: |
          # every tweak's manifest (README.md front matter) is valid and names its scripts
          python3 lib/sft.py mods check packs/original && python3 lib/sft.py mods check packs/third-party
          ./install.sh list
          ./install.sh _deps all
          ./install.sh _deps signal | grep -q '^wallet signal'
          # every pin names a version, an https URL, and a SHA256 (files) or a commit (git)
          for pin in packs/*/*/pin; do
            grep -qE '^version=.+' "$pin" && grep -qE '^url=https://' "$pin" &&
              grep -qE '^(sha256=[0-9a-f]{64}|rev=[0-9a-f]{40})$' "$pin" || { echo "incomplete $pin"; exit 1; }
          done
          # ... and Frame Tweaks' copy (mirror=, with its licence and licence texts; a git commit's archive with its
          # own sha256), or why there's none (nomirror=)
          for pin in packs/*/*/pin packs/*/*/*.pin; do
            if grep -q '^mirror=' "$pin"; then
              grep -qE '^mirror=https://github.com/AstronautCheetah/frame-tweaks/releases/download/mirror/[^/]+$' "$pin" &&
                grep -qE '^license=.+' "$pin" && grep -qE '^license_file=https://' "$pin" &&
                { grep -q '^sha256=' "$pin" || grep -qE '^mirror_sha256=[0-9a-f]{64}$' "$pin"; } || { echo "bad mirror in $pin"; exit 1; }
            else
              grep -qE '^nomirror=.+' "$pin" || { echo "$pin: no mirror= and no nomirror= reason"; exit 1; }
            fi
          done
          ! grep -vE '^(#|$|[A-Za-z0-9_.-]+==[0-9][0-9A-Za-z.]*$)' lib/python-constraints.txt   # exact versions only
      - name: Unit tests
        run: |
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 xvfb libxtst6 >/dev/null
          python3 -m pip install --quiet PyQt6 pyyaml     # (pyyaml: tests compare our manifest reader with it)
          QT_QPA_PLATFORM=offscreen python3 -m unittest discover -s tests -v
      - name: AppStream metadata and desktop entry
        run: |
          sudo apt-get install -y appstream desktop-file-utils >/dev/null
          appstreamcli validate --no-net share/metainfo/*.metainfo.xml
          for f in share/applications/*.desktop; do sed 's|@REPO@|/opt/x|' "$f" > "/tmp/$(basename "$f")"; desktop-file-validate "/tmp/$(basename "$f")"; done
      - name: Docs consistency (README rows, links, generated tables)
        run: |
          python3 dev/check-docs.py
          python3 dev/gen-docs.py --check
      - name: Install, status and uninstall in a throwaway home
        run: |
          sudo apt-get install -y libarchive-tools     # bsdtar, as on SteamOS
          dev/test-tweaks.sh
