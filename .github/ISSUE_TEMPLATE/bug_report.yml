name: Bug report
description: Something a tweak does (or doesn't do) on your Frame
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste passwords, tokens or wallet contents.
        Security problems: use a private security advisory instead (see SECURITY.md).
  - type: input
    id: tweak
    attributes:
      label: Which tweak?
      description: Or the installer window, or get.sh if Frame Tweaks didn't install.
      placeholder: e.g. arrowpad, wallet, curvature
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Frame Tweaks version
      description: Filled in when you come here from **🐞 Report a problem** in the installer window.
      placeholder: e.g. 0.6.1
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Desktop mode or VR? Steps to reproduce if you have them.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: |
        In the installer window press **🐞 Report a problem** (or run `./install.sh report` in the
        Frame Tweaks folder). It saves `~/frame-tweaks-debug-….txt` with versions, status and
        recent logs, with your user name, home folder, host and phone names, and IP, MAC and
        e-mail addresses removed. Read it, then drag it here.
        If Frame Tweaks didn't install, or its window won't open, paste what the terminal printed
        instead.
    validations:
      required: true
