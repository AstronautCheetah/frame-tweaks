name: Bug report
description: Something a tweak does (or doesn't do) on your Frame
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste passwords, tokens or wallet contents.
        Security problems: use a private security advisory instead (see SECURITY.md).
  - type: input
    id: tweak
    attributes:
      label: Which tweak?
      placeholder: e.g. arrowpad, wallet, curvature
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Desktop mode or VR? Steps to reproduce if you have them.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: |
        In the installer window press **Diagnostics** (or run `./install.sh debug-info` in the
        Frame Tweaks folder). It saves `~/frame-tweaks-debug-….txt` with versions, status and
        recent logs, with user names, paths and IP addresses removed. Read it, then drag it here.
    validations:
      required: true
